appId: ai.seenalyze.studio
productName: SEENALYZE STUDIO
copyright: Copyright (c) SEENALYZE
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: vendor
    to: vendor
    filter: ["**/*", "!**/.seenalyze-version"]
  - from: LICENSE
    to: LICENSE
asar: true
protocols:
  - name: SEENALYZE STUDIO
    schemes: [seenalyze-studio]
mac:
  category: public.app-category.video
  target: [dmg, zip]
  hardenedRuntime: true
  # Chromium/CEF data files are sealed by their bundle's signature; signing
  # each one separately (~840 files, one timestamp request each) took ~6 min.
  signIgnore: ['\.(pak|png|bin|dat|json|txt)$']
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: SEENALYZE STUDIO uses your camera when you add it as a source or record it with your screen.
    NSMicrophoneUsageDescription: SEENALYZE STUDIO uses your microphone when you add it as a source or record it with your screen.
    NSAudioCaptureUsageDescription: SEENALYZE STUDIO records system sound only when you turn it on for a screen recording.
  # Screen-recording helpers and the preview presenter built by scripts/build-native.mjs.
  extraResources:
    - from: bin
      to: bin
      filter: [screen-recorder, video-muxer, media-tools, window-list, audio-inputs, preview-presenter.node]
dmg:
  # Rendered from build/source/dmg-background.svg (scripts/render-installer-art.sh, 1x and @2x).
  background: build/dmg-background.png
  iconSize: 112
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 210
      type: file
    - x: 480
      y: 210
      type: link
      path: /Applications
win:
  target: [nsis]
  # Screen-recording helpers (window list and caption audio preparation).
  extraResources:
    - from: native
      to: native
      filter: ["*.ps1"]
# The installer window is custom (build/installer.nsh + build/installer/hero.bmp, rendered by
# scripts/render-installer-art.sh): one compact window with Install and an optional Options page
# (location, shortcuts). It always installs for the current user under %LOCALAPPDATA%\Programs, so
# neither installing nor updating needs administrator rights.
nsis:
  oneClick: false
  perMachine: false
  # The custom Options page picks the folder; the stock directory page stays off.
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerLanguages:
    - en_US
    - hu_HU
    - de_DE
    - cs_CZ
    - es_ES
    - pt_BR
    - hr_HR
