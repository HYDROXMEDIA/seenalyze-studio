<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- SEENALYZE STUDIO DMG window background (scripts/render-installer-art.sh). Light surface so
       Finder's dark icon labels stay legible; violet accents from the app icon. The app icon sits
       at (180, 210) and the Applications link at (480, 210), both 112 px. Only the product name,
       so the background works in every language. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.95" cy="1" r="0.55">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="660" height="400" fill="url(#surface)"/>
  <rect width="660" height="400" fill="url(#violet)"/>
  <rect width="660" height="400" fill="url(#pink)"/>
  <text x="330" y="62" text-anchor="middle" font-family="SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5" fill="#1e1433">SEENALYZE <tspan fill="#6d28d9">STUDIO</tspan></text>
  <!-- Soft wells behind the two icons -->
  <circle cx="180" cy="210" r="86" fill="#6d28d9" fill-opacity="0.05"/>
  <circle cx="480" cy="210" r="86" fill="#6d28d9" fill-opacity="0.05"/>
  <!-- Arrow from the app to Applications -->
  <path d="M282 210 H356" stroke="#6d28d9" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>
  <path d="M360 197 L378 210 L360 223" fill="none" stroke="#6d28d9" stroke-opacity="0.9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
