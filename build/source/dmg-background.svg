<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- SEENALYZE STUDIO DMG window background (scripts/render-installer-art.sh, 1x and @2x).
       Near-black ground with a 22 px dot grid, lit purple dots around the app icon (180, 210)
       fading toward the Applications link (480, 210), and a row of rising dots with a chevron
       as the arrow. Both icons are 112 px. No text, so it works in every language.
       Finder can't recolor icon labels (electron-builder has no label color option) and draws
       them black in light mode, so each label sits on a neutral plate (relative luminance
       ~0.18) that keeps black and white labels alike at about 4.5:1 contrast. -->
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
    <pattern id="lit" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.9" fill="#b594ff" fill-opacity="0.9"/>
    </pattern>
    <!-- The grid fades out toward the window edges (ellipse 528 x 300 around 330, 208). -->
    <radialGradient id="gridFade" gradientUnits="userSpaceOnUse" cx="330" cy="208" r="528"
                    gradientTransform="translate(330 208) scale(1 0.5682) translate(-330 -208)">
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="litApp" gradientUnits="userSpaceOnUse" cx="180" cy="210" r="120">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="litMid" gradientUnits="userSpaceOnUse" cx="330" cy="210" r="70">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="litApps" gradientUnits="userSpaceOnUse" cx="480" cy="210" r="120">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask" maskUnits="userSpaceOnUse" x="0" y="0" width="660" height="400">
      <rect width="660" height="400" fill="url(#gridFade)"/>
    </mask>
    <mask id="litMask" maskUnits="userSpaceOnUse" x="0" y="0" width="660" height="400">
      <rect width="660" height="400" fill="url(#litApp)"/>
      <rect width="660" height="400" fill="url(#litMid)"/>
      <rect width="660" height="400" fill="url(#litApps)"/>
    </mask>
  </defs>
  <rect width="660" height="400" fill="#050505"/>
  <rect width="660" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="660" height="400" fill="url(#lit)" mask="url(#litMask)"/>
  <!-- Arrow: five dots with rising opacity, then a chevron. -->
  <g fill="#c9a6ff">
    <circle cx="262.5" cy="210" r="2.5" fill-opacity="0.35"/>
    <circle cx="276.5" cy="210" r="2.5" fill-opacity="0.5"/>
    <circle cx="290.5" cy="210" r="2.5" fill-opacity="0.65"/>
    <circle cx="304.5" cy="210" r="2.5" fill-opacity="0.8"/>
    <circle cx="318.5" cy="210" r="2.5" fill-opacity="0.95"/>
  </g>
  <path d="M333 203 L341 210 L333 217" fill="none" stroke="#c9a6ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Plates under the Finder icon labels (the icons end at y 266). -->
  <g fill="#7a7384">
    <rect x="108" y="270" width="144" height="20" rx="10"/>
    <rect x="408" y="270" width="144" height="20" rx="10"/>
  </g>
</svg>
