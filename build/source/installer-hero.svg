<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="160" viewBox="0 0 500 160">
  <!-- SEENALYZE STUDIO Windows installer hero (build/installer/hero.bmp, 500 x 160, 24-bit).
       Same surface and violet accents as dmg-background.svg; the bottom edge fades into the
       installer window color (#F8F6FF in build/installer.nsh). The app icon is embedded by
       scripts/render-installer-art.sh; no text. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.5" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.95" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#f8f6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#f8f6ff"/>
    </linearGradient>
    <clipPath id="iconClip"><rect x="210" y="36" width="80" height="80" rx="18"/></clipPath>
  </defs>
  <rect width="500" height="160" fill="url(#surface)"/>
  <rect width="500" height="160" fill="url(#violet)"/>
  <rect width="500" height="160" fill="url(#pink)"/>
  <!-- Two tilted 16:9 screens hint at streaming and recording; one shows a live dot. -->
  <g fill="none" stroke="#6d28d9" stroke-opacity="0.14" stroke-width="2">
    <rect x="62" y="50" width="104" height="60" rx="9" transform="rotate(-8 114 80)"/>
    <rect x="334" y="50" width="104" height="60" rx="9" transform="rotate(8 386 80)"/>
  </g>
  <circle cx="420" cy="62" r="5" fill="#ef4444" fill-opacity="0.55"/>
  <circle cx="250" cy="76" r="58" fill="#6d28d9" fill-opacity="0.06"/>
  <image x="210" y="36" width="80" height="80" clip-path="url(#iconClip)" xlink:href="data:image/png;base64,ICON_BASE64"/>
  <rect width="500" height="160" fill="url(#fade)"/>
</svg>
