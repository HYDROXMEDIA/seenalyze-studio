<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="160" viewBox="0 0 500 160">
  <!-- SEENALYZE STUDIO Windows installer hero (build/installer/hero.bmp, 500 x 160, 24-bit).
       Same near-black ground, 22 px dot grid and lit purple dots as dmg-background.svg, brightest
       around the centered 64 px app icon; the installer pages below it use #0B0B0C
       (build/installer.nsh). The app icon is embedded by scripts/render-installer-art.sh; no text. -->
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
    <pattern id="lit" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="1.9" fill="#b594ff" fill-opacity="0.9"/>
    </pattern>
    <radialGradient id="litCenter" gradientUnits="userSpaceOnUse" cx="250" cy="80" r="110">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="litLeft" gradientUnits="userSpaceOnUse" cx="70" cy="40" r="60">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="litRight" gradientUnits="userSpaceOnUse" cx="440" cy="130" r="60">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="litMask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="160">
      <rect width="500" height="160" fill="url(#litCenter)"/>
      <rect width="500" height="160" fill="url(#litLeft)"/>
      <rect width="500" height="160" fill="url(#litRight)"/>
    </mask>
    <clipPath id="iconClip"><rect x="218" y="48" width="64" height="64" rx="15"/></clipPath>
  </defs>
  <rect width="500" height="160" fill="#050505"/>
  <rect width="500" height="160" fill="url(#grid)"/>
  <rect width="500" height="160" fill="url(#lit)" mask="url(#litMask)"/>
  <image x="218" y="48" width="64" height="64" clip-path="url(#iconClip)" xlink:href="data:image/png;base64,ICON_BASE64"/>
</svg>
